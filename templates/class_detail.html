<div class="row">
    <div class="col-md-8">
        <div class="card shadow p-4">
            <h5>Session Attentiveness</h5>
            <canvas id="attnChart"></canvas>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-4">
            <h5>Class Summary</h5>
            <div class="donut-container">
                 <canvas id="summaryDonut"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Fetch the timeline.json generated by main.py
    fetch('/static/outputs/timeline.json').then(res => res.json()).then(data => {
        new Chart(document.getElementById('attnChart'), {
            type: 'line',
            data: {
                labels: data.map(d => d.time),
                datasets: [{
                    label: 'Attentiveness Score',
                    data: data.map(d => d.score),
                    borderColor: '#3d5afe',
                    tension: 0.4
                }]
            }
        });
    });
</script>
